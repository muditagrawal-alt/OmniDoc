# docker compose -f docker-compose.yml -f deploy/compose.https.yml up -d
# Serves OmniDoc on https://$OMNIDOC_DOMAIN (ports 80 and 443 must be open).
services:
  omnidoc:
    ports: !reset []
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      OMNIDOC_DOMAIN: ${OMNIDOC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - omnidoc

volumes:
  caddy-data:
