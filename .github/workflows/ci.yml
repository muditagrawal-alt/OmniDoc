name: CI

# Every push and pull request: the web app is linted and built, the server's tests run on the slim
# build, and the slim server's memory is measured on a 1 GB budget. On main, once both pass, the
# slim server image is published to GitHub's container registry, ready for ClawCloud Run to pull.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  server:
    name: Server tests and memory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-slim.txt
      - name: System packages (OCR, PDF reports)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-osd tesseract-ocr-eng \
            fonts-dejavu-core libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements-slim.txt pytest cbor2 psutil
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/onnx
          key: onnx-models-v1
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Memory of the slim server on a 1 GB budget
        run: python benchmarks/memory_check.py --budget 900

  image:
    name: Publish the slim server image
    needs: [web, server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Arm too: Oracle Cloud's Always Free VMs are Ampere (arm64).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.slim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/omnidoc:slim
            ghcr.io/${{ github.repository_owner }}/omnidoc:slim-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=OmniDoc slim server for 1 GB hosts
          cache-from: type=gha
          cache-to: type=gha,mode=max
